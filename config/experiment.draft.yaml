# Copy this file to config/experiment.yaml after the pilot. Empty values are
# intentional: main experiment commands refuse incomplete configuration.
azure:
  resource_group: null
  primary_region: null
  secondary_region: null
  primary_cluster: null
  secondary_cluster: null

carbon:
  api_base_url: "https://api.electricitymaps.com/v4"
  provider: "azure"
  primary_provider_region: null
  secondary_provider_region: null
  forecast_horizon_hours: null
  cache_directory: "data/carbon_cache"
