name: Publish versioned controller container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        default: v1.0.0

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release version and image name
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PYCODE'
          import os, re, tomllib
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[1-9][0-9]*\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a stable vMAJOR.MINOR.PATCH release tag')
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          if tag != f'v{version}':
              raise SystemExit('Release tag does not match pyproject.toml')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'VERSION={version}\n')
              f.write(f'MAJOR={version.split(".")[0]}\n')
              f.write(f'IMAGE=ghcr.io/{os.environ["GITHUB_REPOSITORY"].lower()}\n')
          PYCODE
      - name: Run scheduler tests
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen --extra dev --extra agent
          uv run --frozen --extra dev --extra agent pytest
      - name: Build and verify the container
        run: |
          docker build -f deploy/controller/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label 'org.opencontainers.image.description=Trust-gated carbon-aware benchmark scheduler for multi-region Azure AKS' \
            -t "${IMAGE}:${VERSION}" .
          docker run --rm --entrypoint python "${IMAGE}:${VERSION}" -c \
            "import carbon_scheduler, importlib.metadata; assert carbon_scheduler.__version__ == '${VERSION}'; assert importlib.metadata.version('carbon-scheduler') == '${VERSION}'; import scripts.run_experiment"
          docker run --rm --entrypoint carbon-scheduler "${IMAGE}:${VERSION}" --help
      - name: Publish to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:${VERSION}"
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:${MAJOR}"
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:${MAJOR}"
          docker push "${IMAGE}:latest"
          printf '### Published container\n\n`docker pull %s:%s`\n' "$IMAGE" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
