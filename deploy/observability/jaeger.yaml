# Jaeger is intentionally an in-cluster, single-node trace viewer for active
# research sessions. It is not configured as durable production observability.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: scheduler-system
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: trust-gated-carbon-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: trust-gated-carbon-scheduler
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.63.0
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: scheduler-system
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: trust-gated-carbon-scheduler
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
