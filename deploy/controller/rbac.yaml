apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler-controller
  namespace: scheduler-system
  labels:
    app.kubernetes.io/name: scheduler-controller
    app.kubernetes.io/part-of: trust-gated-carbon-scheduler
automountServiceAccountToken: true
---
# The controller has only the local permissions needed to inspect its own
# configuration and create/read benchmark Jobs. It is intentionally not
# cluster-admin and cannot alter DeathStarBench Deployments or StatefulSets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scheduler-controller-config
  namespace: scheduler-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scheduler-controller-config
  namespace: scheduler-system
subjects:
  - kind: ServiceAccount
    name: scheduler-controller
    namespace: scheduler-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scheduler-controller-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scheduler-benchmark-dispatcher
  namespace: benchmark
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scheduler-benchmark-dispatcher
  namespace: benchmark
subjects:
  - kind: ServiceAccount
    name: scheduler-controller
    namespace: scheduler-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scheduler-benchmark-dispatcher
