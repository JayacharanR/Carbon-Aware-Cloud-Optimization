apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-controller
  namespace: scheduler-system
  labels:
    app.kubernetes.io/name: scheduler-controller
    app.kubernetes.io/part-of: trust-gated-carbon-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler-controller
        app.kubernetes.io/part-of: trust-gated-carbon-scheduler
    spec:
      serviceAccountName: scheduler-controller
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # `kustomize edit set image carbon-scheduler-controller=<registry>/<image>:<tag>`
          # must replace this local name before applying to AKS.
          image: carbon-scheduler-controller
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - "exec ${CONTROLLER_COMMAND}"
          envFrom:
            - configMapRef:
                name: scheduler-runtime-config
          env:
            - name: ELECTRICITY_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: electricity-maps-api-key
            - name: NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: neo4j-username
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: neo4j-password
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: qdrant-api-key
          volumeMounts:
            - name: experiment-config
              mountPath: /etc/carbon-scheduler
              readOnly: true
            - name: run-inputs
              mountPath: /etc/carbon-scheduler/inputs
              readOnly: true
            - name: artifacts
              mountPath: /var/lib/carbon-scheduler
            # The optional Secret may hold a least-privilege kubeconfig for
            # the secondary cluster. It is absent in single-cluster smoke runs.
            - name: remote-cluster-credentials
              mountPath: /var/run/scheduler/kubeconfigs
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
      volumes:
        - name: experiment-config
          configMap:
            name: scheduler-experiment-config
        - name: run-inputs
          configMap:
            name: scheduler-run-inputs
        - name: artifacts
          persistentVolumeClaim:
            claimName: scheduler-artifacts
        - name: remote-cluster-credentials
          secret:
            secretName: scheduler-cluster-credentials
            optional: true
