apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-runtime-config
  namespace: scheduler-system
  labels:
    app.kubernetes.io/name: scheduler-controller
    app.kubernetes.io/part-of: trust-gated-carbon-scheduler
data:
  # These values must be patched for a concrete one-shot replay run. Empty
  # values intentionally make the controller exit rather than inventing a
  # study mode or input trace.
  CONTROLLER_COMMAND: "python -m carbon_scheduler.controller"
  EXPERIMENT_CONFIG: "/etc/carbon-scheduler/experiment.yaml"
  EXPERIMENT_MODE: ""
  REPLAY_TRACE_PATH: ""
  GRAPH_PATH: ""
  TARGET_CONFIG_PATH: ""
  LATENCY_CATALOG_PATH: ""
  RUN_ARTIFACT_ROOT: "/var/lib/carbon-scheduler/runs"
  CONTROLLER_DRY_RUN: "false"
  CONTROLLER_DEMO_AGENT: "false"
  CONTROLLER_DEMO_EVALUATOR: ""
  SCHEDULER_RETRIEVAL_BACKEND: "qdrant"
  SCHEDULER_ORCHESTRATION_BACKEND: "langgraph"
  CARBON_CACHE_DIRECTORY: "/var/lib/carbon-scheduler/carbon-cache"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.scheduler-system.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  NEO4J_URI: "bolt://neo4j.scheduler-system.svc.cluster.local:7687"
  NEO4J_DATABASE: "neo4j"
  QDRANT_URL: "http://qdrant.scheduler-system.svc.cluster.local:6333"
  # Use a reachable, authenticated tunnel endpoint; do not expose the laptop
  # Ollama listener publicly. This intentionally has no default endpoint.
  OLLAMA_BASE_URL: ""
